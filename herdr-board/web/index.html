<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OPSX 看板</title>
<style>
/* 藍色淺色主題。看板資料來自 /api/collect（opsx collect），紀錄與 banner 來自 /api/log（opsx timeline），卡內檔案來自 /api/card-files。 */
:root{
  --bg:#f5f5f5;--panel:#ffffff;--col:#fafafa;--line:#e5e7eb;--line-2:#eef0f2;
  --fg:#292c32;--fg-2:#5b616b;--fg-3:#9097a1;
  --teal:#2563EB;--teal-2:#60A5FA;--teal-bg:#EAF1FE;
  --you:#1d4ed8;--you-bar:#2563EB;--you-bg:#F5F8FF;--you-line:#C7D7FB;
  --run:#0891b2;--wait:#64748b;--idle:#7c3aed;--inbox:#6b7280;--done:#16a34a;--danger:#dc2626;--warn:#c2410c;
  --pet-claude:#2563EB;--pet-codex:#0EA5E9;--pet-claude-body:#DBEAFE;--pet-codex-body:#E0F2FE;--pet-screen:#FFFFFF;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Segoe UI',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:var(--teal);text-decoration:none}a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}
.faint{color:var(--fg-3)}.muted{color:var(--fg-2)}
[hidden]{display:none!important}
button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:6px;min-height:30px;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--teal-2)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
button.primary:hover{background:var(--you)}
button.sm{min-height:26px;font-size:12px;padding:0 9px}
button.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
button.danger{color:var(--danger)}
button.link{border:0;background:none;padding:0;min-height:0;color:var(--teal);font:inherit}
button.link:hover{text-decoration:underline}
input[type=text],select{font:inherit;font-size:13px;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:6px;min-height:30px;padding:0 8px;outline:none}
input[type=text]:focus,select:focus{border-color:var(--teal-2)}
:focus-visible{outline:2px solid var(--teal-2);outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:4px;padding:0 6px;white-space:nowrap;border:1px solid;line-height:1.6;background:#fff}
.badge.data,.badge.accent{color:var(--you);border-color:var(--you-line);background:var(--teal-bg)}
.badge.ok{color:var(--done);border-color:#bbf7d0}
.badge.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.badge.warn{color:var(--warn);border-color:#fed7aa}
.badge.line{color:var(--fg-2);border-color:var(--line)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.dot.live{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--fg-2)}
.tag.sec{border-color:transparent;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);font-weight:600}

/* 頂列 */
.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:var(--fg)}
.brand .logo{width:28px;height:28px;border-radius:7px;background:var(--teal);color:#fff;display:grid;place-items:center}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;color:var(--fg);font-size:14px}
.nav a:hover{background:#f1f3f4;text-decoration:none}
.nav a.on{background:var(--teal-bg);color:var(--teal);font-weight:600}
.nav svg{flex:none;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .n{font-size:12px;color:var(--fg-3)}
.nav .n.you{background:var(--you-bar);color:#fff;border-radius:999px;padding:0 7px;font-weight:600}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stamp{font-size:11px;color:var(--fg-3)}
main{min-width:0;padding:18px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.errors{margin-bottom:12px;font-family:var(--mono);font-size:11px;color:var(--danger);display:flex;flex-direction:column;gap:2px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{margin:0;font-size:22px;font-weight:600}
.ph p{margin:2px 0 0;color:var(--fg-2);font-size:13px}
.ph .right{margin-left:auto;font-size:12px;color:var(--fg-3)}
.newbar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.newbar.drag{outline:2px dashed var(--teal);outline-offset:4px}
.newbar textarea{flex:1;min-width:0;font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;outline:none;resize:vertical}
.newbar textarea:focus{border-color:var(--teal-2)}
.newbar .side{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.new-files{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.new-files li{display:flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 0 0 8px}
.repo-grants{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--fg-2);background:var(--panel)}
.repo-grants .on{color:var(--fg)}

/* 篩選 */
.fwrap{position:relative;margin-bottom:16px}
.fbar{display:flex;gap:8px;align-items:center}
.fbar .fq{min-height:32px;border:1px solid var(--line);border-radius:999px;padding:0 14px;font:inherit;font-size:13px;width:280px;max-width:100%;background:#fff;outline:none}
.fbar .fq:focus{border-color:var(--teal-2)}
.fbtn{min-height:32px;border-radius:999px;padding:0 12px}
.fbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fbtn[aria-expanded=true]{border-color:var(--teal);color:var(--teal)}
.fcount{background:var(--teal);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
.fpanel{position:absolute;top:40px;left:0;width:min(640px,100%);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.14);padding:14px 16px;display:flex;flex-direction:column;gap:10px;z-index:30}
.fg{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;align-items:start}
.fg>span{font-size:12px;color:var(--fg-3);padding-top:4px}
.fg>div{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.fg>div>span{font-size:12px;color:var(--fg-3)}
.chip{min-height:26px;padding:0 9px;border-radius:999px;font-size:12px;background:#fff}
.chip i{font-style:normal;opacity:.6;font-size:11px}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.fpanel input[type=date]{min-height:26px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px;padding:0 6px;background:#fff;color:var(--fg)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.fchip{min-height:24px;padding:0 6px 0 10px;border-radius:999px;font-size:12px;background:var(--teal-bg);border-color:transparent;color:var(--teal)}
.fchip span{font-size:14px;line-height:1;opacity:.7}
.fchips .clr{border:0;background:none;color:var(--fg-2);font-size:12px;min-height:24px;padding:0 4px;text-decoration:underline}

/* 總覽 */
.ov{display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(280px,2fr) minmax(200px,1fr) minmax(220px,1.4fr);gap:12px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.tile h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--fg-2)}
.tile.you{background:var(--you-bg);border-color:var(--you-line)}
.big{font-size:34px;font-weight:700;line-height:1.1;color:var(--you)}
.big small{font-size:13px;font-weight:500;color:var(--fg-2);margin-left:6px}
.youlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.youlist li{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.youlist a{color:var(--fg)}
.youlist b{color:var(--you);font-weight:600;margin-right:4px}
.counter{font-size:12px;color:var(--fg-2);margin-top:6px}
.seg{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line-2);margin:4px 0 12px}
.seg i{display:block;height:100%}
.seg i+i{border-left:2px solid #fff}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px}
.legend a{display:flex;align-items:center;gap:7px;color:var(--fg);font-size:12px}
.legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
.legend b{margin-left:auto;font-weight:600}
.kv2{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13px;align-items:center}
.kv2 b{font-size:18px;font-weight:700;text-align:right}
.kv2 .sub{grid-column:1/3;font-size:11px;color:var(--fg-3);margin-top:-4px}
.repos{display:flex;flex-direction:column;gap:7px}
.repos .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:12px}
.repos .bar{grid-column:1/3;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;display:flex}
.repos .bar i{display:block;height:100%}
.milestones{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:11px;color:var(--fg-2)}
.milestones .link.badge.warn{padding:0 4px}

/* 看板 */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.colm{flex:1 0 280px;max-width:380px;background:var(--col);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 120px);min-height:200px}
.colm>header{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px 10px 0 0;background:var(--panel)}
.colm>header h2{margin:0;font-size:14px;font-weight:600}
.colm>header .hint{font-size:11px;color:var(--fg-3)}
.pill{margin-left:auto;min-width:22px;height:22px;border-radius:11px;display:inline-grid;place-items:center;font-size:12px;font-weight:600;padding:0 7px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.pill.solid{color:#fff;background:var(--c)}
.cards{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
.empty{color:var(--fg-3);font-size:12px;text-align:center;padding:14px 0}
.extra{font-size:12px;color:var(--fg-2);border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.extra h4{margin:0;font-size:11px;font-weight:600;color:var(--fg-3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-width:0}
.card:hover{border-color:var(--teal-2);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card[aria-selected=true]{border-color:var(--teal)}
.card.you{background:var(--you-bg);border-color:var(--you-line);box-shadow:inset 3px 0 0 var(--you-bar)}
.card.gone{opacity:.55}
.card.sending .st,.card.sending .c-act{opacity:.55}
.c-top{display:flex;gap:10px;align-items:flex-start}
.c-ttl{min-width:0;flex:1}
.c-ttl .t{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-ttl .m{font-family:var(--mono);font-size:11px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.st{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;line-height:1.45;color:var(--fg-2);min-width:0}
.st .q{color:var(--you);font-weight:600;overflow-wrap:anywhere}
.st .sep{color:var(--fg-3)}
.l2{font-size:12px;color:var(--fg-2)}
.prog{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--fg-3);width:100%}
.prog .bar{flex:1;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;min-width:40px}
.prog .bar i{display:block;height:100%;background:var(--teal)}
.prog .bar i.warn{background:var(--danger)}
.c-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.c-act .muted{font-size:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}
.row .main{min-width:0;flex:1}
.row .title{font-weight:600}
.row .meta{font-family:var(--mono);font-size:11px;color:var(--fg-3);margin-left:6px}
.row .act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .n{font-weight:600;margin-left:auto}
.row button.tg{border:0;background:transparent;padding:0;min-height:20px;display:inline-flex;align-items:center;gap:6px}
.row button.tg .chev,.gh .chev{width:0;height:0;border-left:5px solid var(--fg-3);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform 120ms;flex:none}
.row button.tg[aria-expanded=true] .chev,.gh[aria-expanded=true] .chev{transform:rotate(90deg)}
.syncline{font-size:11px;color:var(--fg-2);font-family:var(--mono)}
.gk{border:1px solid var(--line);border-radius:8px;background:#fff}
.gk>.gh{width:100%;border:0;border-radius:8px;background:transparent;min-height:34px;padding:0 10px;display:flex;align-items:center;gap:8px;font-size:12px;text-align:left}
.gk>.gh:hover{background:#f6f7f9}
.gh .gn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh .gs{font-size:11px;color:var(--fg-3);font-family:var(--mono);white-space:nowrap}
.gh .mini{margin-left:auto;display:flex;width:56px;height:6px;border-radius:3px;overflow:hidden;background:var(--line-2);flex:none}
.gh .mini i{display:block;height:100%}
.gh .gc{font-weight:600;min-width:16px;text-align:right}
.gk>.gb{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px}
.gk.shut>.gb{display:none}

/* 卡片細節頁 */
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-3);margin-bottom:14px;flex-wrap:wrap}
.crumbs .sl{font-family:var(--mono);color:var(--fg)}
.dh{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
.dh.you{border-color:var(--you-line);background:var(--you-bg)}
.dh h1{margin:0;font-size:19px;font-weight:600;line-height:1.4}
.dh .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px;color:var(--fg-2)}
.dh .flow{font-family:var(--mono);font-size:11px;color:var(--fg-3);margin-top:8px}
.dh .flow .done{color:var(--fg-2)}.dh .flow .here{color:var(--you);font-weight:700}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:14px}
.box h3,.dmain section h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--fg-2);display:flex;align-items:center;gap:8px}
.src{font-weight:400;font-family:var(--mono);color:var(--fg-3);font-size:11px}
.ask{background:var(--panel);border:1px solid var(--you-line);border-left:4px solid var(--you-bar);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.ask.critical{border-left-color:var(--danger)}
.ask.ok{border-left-color:var(--done)}
.ask.sending{opacity:.6}
.ask .q{font-size:16px;font-weight:600;line-height:1.5}
.ask .kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px 12px;margin:0;font-size:13px}
.ask .kv dt{color:var(--fg-3)}.ask .kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.ask .answers{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ask .answers input{flex:1;min-width:160px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts .path{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg-3);word-break:break-all}
.dgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.dside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:70px}
.dside h3{margin:0 0 4px;padding:0 8px;font-size:11px;font-weight:600;color:var(--fg-3);letter-spacing:.08em}
.dmain{min-width:0;display:flex;flex-direction:column;gap:14px}
.dmain section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:0}
.tabs{display:flex;flex-direction:column;gap:1px}
.tabs a{display:flex;align-items:center;gap:6px;min-height:30px;padding:0 8px;border-radius:7px;font-size:13px;color:var(--fg)}
.tabs a:hover{background:#f1f3f4;text-decoration:none}
.tabs a[aria-selected=true]{background:var(--teal-bg);color:var(--teal);font-weight:600}
.tabs .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px}
.tabs .sz{margin-left:auto;font-size:11px;color:var(--fg-3);flex:none}
.facts{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px 8px;padding:0 8px;font-size:12px;margin:0}
.facts dt{color:var(--fg-3)}.facts dd{margin:0;overflow-wrap:anywhere}
.conds{list-style:none;margin:0;padding:0 8px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.conds .y{color:var(--done)}.conds .n{color:var(--danger)}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 28px;min-width:0}
.doc>.fh{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
.doc>.fh h2{margin:0;font-size:16px;font-family:var(--mono);font-weight:600}
.doc>.fh span{font-size:12px;color:var(--fg-3)}
.md{font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.md h1,.md h2,.md h3,.md h4{line-height:1.35;margin:1.3em 0 .45em}
.md h1{font-size:20px}.md h2{font-size:17px;border-bottom:1px solid var(--line-2);padding-bottom:4px}.md h3{font-size:15px}.md h4{font-size:14px;color:var(--fg-2)}
.md p{margin:.55em 0}
.md ul,.md ol{margin:.4em 0;padding-left:1.5em}
.md li{margin:.15em 0}
.md li.task{list-style:none;margin-left:-1.3em}
.md li.task input{margin:0 6px 0 0;vertical-align:-1px;accent-color:var(--teal)}
.md code{font-family:var(--mono);font-size:12.5px;background:#f1f3f4;border-radius:4px;padding:1px 5px}
.md pre{background:#f7f8f9;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:12.5px;line-height:1.55}
.md pre code{background:none;padding:0}
.md blockquote{margin:.6em 0;padding:2px 14px;border-left:3px solid var(--teal-2);color:var(--fg-2);background:var(--you-bg)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md .tw{overflow-x:auto;margin:.6em 0}
.md table{border-collapse:collapse;font-size:13px;min-width:50%}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:#f7f8f9;font-weight:600}
.note{color:var(--fg-3);font-size:13px;padding:12px 0}
.note.err{color:var(--danger)}
.term{background:#f7f8f9;color:var(--fg);font-family:var(--mono);font-size:12px;line-height:1.55;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;white-space:pre-wrap;overflow-x:auto}
/* 框線圖一折行就斷，所以不沿用 .term 的 pre-wrap */
.term.logic-map{white-space:pre}
.note-row{font-size:13px;padding:3px 0;word-break:break-word}
.note-row.sending{color:var(--fg-3);font-style:italic}
#note-add{width:100%;margin-top:8px}
.tree{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:7px 0;border-top:1px solid var(--line-2);font-size:13px}
.tree:first-of-type{border-top:0}
.tree.sub{padding-left:22px}
.tree.sending{opacity:.55}
.tree .slug{font-family:var(--mono);color:var(--teal);min-width:140px}
.tree .t{color:var(--fg-2);min-width:0;overflow-wrap:anywhere}
.tree .answers{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap}

/* 變更、已歸檔、紀錄 */
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.grp>h2{margin:0;padding:11px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.grp>h2 .c{font-size:12px;color:var(--fg-3);font-weight:500}
.lrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--line-2);color:var(--fg)}
.lrow:first-of-type{border-top:0}
.lrow:hover{background:#fafbfb;text-decoration:none}
.lrow.you{background:var(--you-bg)}
.lrow .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .m{font-size:11px;color:var(--fg-3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:8px 16px;border-top:1px solid var(--line-2);font-size:13px;align-items:center;color:var(--fg)}
.arow:hover{background:#fafbfb;text-decoration:none}
.arow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .d,.arow .m{font-size:11px;color:var(--fg-3);font-family:var(--mono)}
.filters{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.filters button{min-height:28px;font-size:12px;padding:0 10px}
.filters button[aria-pressed=true]{background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}
.filters .src{margin-left:auto}
.day{font-size:12px;font-weight:600;color:var(--fg-2);margin:18px 0 6px}
.ev{display:grid;grid-template-columns:44px 170px 70px minmax(0,1fr) auto;gap:12px;padding:8px 16px;border-top:1px solid var(--line-2);font-size:13px;align-items:center}
.ev:first-child{border-top:0}
.ev .t{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.ev .cd{font-family:var(--mono);font-size:12px;color:var(--teal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;min-height:0;padding:0;text-align:left;display:block}
.ev .cd:hover{text-decoration:underline}
.ev .cd.sys{color:var(--fg-3);cursor:default;text-decoration:none}
.ev .who{font-size:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .who.you{color:var(--you);font-weight:600}
.ev .what{min-width:0;overflow-wrap:anywhere}
.ev .what .ev-src{display:block;font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.dmain .ev{grid-template-columns:44px 70px minmax(0,1fr) auto;padding:8px 0}
.dmain .ev .cd{display:none}

/* 離開期間 */
.banner{display:flex;align-items:flex-start;gap:14px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--fg-2)}
.banner .t{font-size:12px;font-weight:600;color:var(--teal);white-space:nowrap;padding-top:1px}
.banner ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;max-height:170px;overflow-y:auto;flex:1;min-width:0}
.banner .link{color:var(--fg);text-align:left}
.banner .now{font-size:11px;font-weight:600;color:var(--teal);background:var(--teal-bg);border-radius:4px;padding:0 5px;margin-right:6px}
.banner>button{flex:none;margin-left:auto}

/* 對話框、toast */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
.dialog{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog .box{width:min(460px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 72px rgba(15,23,42,.25);margin:0}
.dialog h2{margin:0;font-size:15px;font-weight:600}
.dialog .opt{display:flex;flex-direction:column;gap:6px}
.dialog .opt>span{font-size:11px;color:var(--fg-2);font-weight:600}
.dialog label.radio{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
.dialog label.radio:has(input:checked){border-color:var(--teal)}
.dialog label.radio input{accent-color:var(--teal);margin-top:3px}
.dialog label.radio b{font-weight:600;display:block;font-size:13px}
.dialog label.radio small{color:var(--fg-3);font-size:12px}
.dialog .go{display:flex;gap:8px;justify-content:flex-end}
.dialog .note{font-size:11px;font-family:var(--mono);line-height:1.6;padding:0}
.kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kinds button{min-height:30px;font-size:12px;padding:0 6px;justify-content:center}
.kinds button[aria-pressed=true]{background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity 120ms;pointer-events:none;z-index:60;max-width:90vw;white-space:pre-wrap}
.toast.on{opacity:1}
.toast.bad{background:var(--danger)}

/* 精靈：同色系淺底，沒有外框與接腳。只有「等你」會動 */
.bot{display:block;overflow:hidden;flex:none}
.bot-claude{filter:drop-shadow(0 2px 3px rgba(37,99,235,.35))}
.bot-codex{filter:drop-shadow(0 2px 3px rgba(14,165,233,.4))}
.bot-ask .ring{animation:ringfade 1.4s ease-in-out infinite}
.bot-sleep{opacity:.55}
@keyframes ringfade{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.bot,.bot *,.dot{animation:none!important}}

@media (max-width:1180px){.ov{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .ov{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr}
  .dside{position:static}
  .doc{padding:16px}
  .fbar .fq{flex:1;width:auto}
  .banner{flex-wrap:wrap}
  .ev,.dmain .ev{grid-template-columns:44px minmax(0,1fr);row-gap:2px}
  .ev .cd,.ev .who,.ev .what,.ev .badge{grid-column:2}
}

<body>
<header class="topbar">
  <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1.5l6.5 3.75v7.5L9 16.5 2.5 12.75v-7.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2" fill="currentColor"/><path d="M9 7V4.2M9 14v-3M4.9 6.6l2.4 1.4M10.7 10l2.4 1.4M4.9 11.4l2.4-1.4M10.7 8l2.4-1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>OPSX</div>

<script>
'use strict';
/* ---------- token、路由、資料 ---------- */
/* card deep link start */
function parseHash(hash){
  const h=new URLSearchParams(hash.replace(/^#/,''));
  return {token:h.get('token'),card:h.get('card')};
}
/* 路由 start */
const PAGES=['board','changes','archived','log'];
/* hash 是 #<頁面路徑>?<篩選條件> */
function splitHash(hash){
  const h=String(hash||'').replace(/^#/,'');const i=h.indexOf('?');
  return i<0?{path:h,query:''}:{path:h.slice(0,i),query:h.slice(i+1)};
}
function route(path){
  let parts;try{parts=String(path||'').split('/').map(decodeURIComponent);}catch(e){return {page:'board'};}
  if(parts[0]==='card'&&parts[1]&&parts[2])return {page:'card',repo:parts[1],slug:parts[2],file:parts.slice(3).join('/')||null};
  return {page:PAGES.includes(parts[0])?parts[0]:'board'};
}
function cardPath(repo,slug,file){
  return 'card/'+encodeURIComponent(repo)+'/'+encodeURIComponent(slug)+(file?'/'+file.split('/').map(encodeURIComponent).join('/'):'');
}
/* 路由 end */
/* token 走 fragment（#token=…）：不進 server log、不進 Referer；讀一次存 sessionStorage，網址列抹掉。
   card 要在抹掉前讀出來，網址列直接換成那張卡的細節頁 */
function readLoadHash(win){
  const p=parseHash(win.location.hash);const t=p.token||new URLSearchParams(win.location.search).get('token');
  const i=p.card?p.card.lastIndexOf('/'):-1;
  try{if(t)win.sessionStorage.setItem('opsx-token',t);if(t||p.card)win.history.replaceState(null,'',win.location.pathname+'#'+(i>0?cardPath(p.card.slice(0,i),p.card.slice(i+1)):'board'));}catch(e){}
  return p.card;
}
function deepLinkTarget(cards,cardKey){
  const c=cards.find(c=>c.repo+'/'+c.slug===cardKey);
  if(!c)return {page:'board',missing:true};
  return {page:'card',path:cardPath(c.repo,c.slug)};
}
/* 只處理一次，之後的刷新不再切頁。server 會先回開頁前的快取（generated_at 只到秒），
   剛建的卡還不在裡面，所以找不到且這份比開頁那一秒舊時先不處理，等較新的 collect */
function applyDeepLink(env,cards,generatedAt){
  const k=env.ui.deepLink;if(!k)return;
  const t=deepLinkTarget(cards,k);
  if(t.missing&&Date.parse(generatedAt)<Math.floor(env.loadedAt/1000)*1000)return;
  env.ui.deepLink=null;
  if(t.missing){env.go('board');env.toast('找不到這張卡',true);}else env.go(t.path);
}
/* card deep link end */
const deepLinkAtLoad=readLoadHash(window);const pageLoadedAt=Date.now();
function token(){try{return sessionStorage.getItem('opsx-token')||'';}catch(e){return '';}}
const api={
  async collect(){const r=await fetch('/api/collect',{headers:{'X-Opsx-Token':token()}});if(r.status===401)throw new Error('token 不對：從 herdr 的 open-board 重開一次');if(!r.ok)throw new Error('collect '+r.status+'：'+(await r.text()).slice(0,200));return r.json();},
  async log(since){const r=await fetch('/api/log'+(since?'?since='+encodeURIComponent(since):''),{headers:{'X-Opsx-Token':token()}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error('log '+r.status+'：'+(j.error||j.stderr||''));return j;},
  async output(card){const r=await fetch('/api/output?card='+encodeURIComponent(card),{headers:{'X-Opsx-Token':token()}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error('output '+r.status+'：'+(j.error||''));return j;},
  /* 400、404 也帶 {ok:false,error}，照樣交給檔案區顯示 */
  async cardFiles(card,path){const r=await fetch('/api/card-files?card='+encodeURIComponent(card)+(path?'&path='+encodeURIComponent(path):''),{headers:{'X-Opsx-Token':token()}});const j=await r.json().catch(()=>null);return j&&typeof j.ok==='boolean'?j:{ok:false,error:'card-files '+r.status};},
  async post(action,body){const r=await fetch('/api/'+action,{method:'POST',headers:{'X-Opsx-Token':token(),'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(action+' '+r.status+'：'+(j.error||j.stderr||''));if(!j.ok)throw new Error((j.stderr||j.stdout||'opsx '+action+' 失敗').trim());return j;}
};
let data={generated_at:null,scopes:[],repo_paths:{},cards:[],sessions:[],unfiled:[],unmatched_agents:[],orphans:[],errors:[],legacy:{},progress:{},worktrees_skipped:[]};let lastRaw='';
const ui={deepLink:deepLinkAtLoad,open:null,entered:null,sel:null,debtRepo:null,busy:false,drop:null,dropText:'',merge:null,mergeInto:'',fileRepo:{},prio:null,prioText:'',prioLevel:null};
let tl=null;let tlErr='';let bannerClosed=false;let seenAt=null;  /* 這頁最後一次送給 /api/seen 的時間 */
const outputs={};  /* 卡 key → {ok, text} 或 {ok:false, error}；進細節頁時才抓 */
const cardFiles={};  /* 卡 key → /api/card-files 的回應；null 是讀取中 */
const fileTexts={};  /* 卡 key + '\n' + 路徑 → 讀檔回應；null 是讀取中 */
const REFRESH_MS=5000;

/* ---------- 標籤 ---------- */
const KIND={dev:'功能','bug-fix':'錯誤修正',refactoring:'重構',perf:'效能',experiment:'實驗',ops:'維運',chore:'雜務'};
const MODE_LABEL={interactive:'互動（每步問）',autopilot:'自動（開到可合併）',drive:'自動（開到可合併）'};
const PHASES=['explore','grill','propose','apply','review','pr','babysit','archive'];
const PHASE_LABEL={explore:'explore',grill:'grill',propose:'propose',apply:'apply',review:'review',pr:'MR',babysit:'MR',archive:'已合併'};
const MODEL_BY_KIND={dev:'claude-opus-5-5',refactoring:'claude-opus-5-5',perf:'claude-opus-5-5',experiment:'claude-opus-5-5','bug-fix':'claude-sonnet-5-5',chore:'claude-sonnet-5-5',ops:'claude-sonnet-5-5'};
const GRANT_LABEL={push:'push',mr:'建立 MR',migrate:'本機 migrate',delete:'刪檔',install:'裝套件',rebase:'rebase',external:'外部 API',env:'寫 .env'};
const GRANT_OF={'這次':'this','這張卡':'card','這個 repo 永遠':'repo'};
const WAIT_BADGE={'等待授權':'data','等待決定':'data','type 不明':'danger','可以合併':'ok','終端機等待輸入':'danger','report 待你決定':'data'};
const COND=[['opened','MR 開著'],['not_draft','不是草稿'],['no_conflicts','沒有衝突'],['pipeline','Pipeline 通過'],['threads','沒有未解的討論']];
const SECTIONS=[
  {name:'待處理',hint:'只有你能做的',c:'#2563EB'},
  {name:'進行中',hint:'agent 在做',c:'#0891b2'},
  {name:'等待中',hint:'等 CI、背景工作',c:'#64748b'},
  {name:'待指派',hint:'可以派工',c:'#7c3aed'},
  {name:'收件匣',hint:'還沒開始',c:'#6b7280'},
  {name:'已完成',hint:'可以歸檔',c:'#16a34a'}];
const NAV=[
  ['board','看板','<rect x="2" y="3" width="4" height="10" rx="1"/><rect x="7" y="3" width="3.5" height="7" rx="1"/><rect x="11.5" y="3" width="2.5" height="5" rx="1"/>'],
  ['changes','變更','<path d="M4 2v12M4 5a3 3 0 0 0 3 3h2a3 3 0 0 1 3 3v3"/><circle cx="12" cy="4" r="1.6"/>'],
  ['archived','已歸檔','<rect x="2" y="3" width="12" height="3" rx="1"/><path d="M3 6v7h10V6M6.5 9h3"/>'],
  ['log','紀錄','<path d="M3 3h10M3 6.5h10M3 10h7M3 13.5h5"/>']];

const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=c=>c.repo+'/'+c.slug;
/* 同 repo 同 slug 可能同時有活卡與已歸檔卡：先取活卡 */
const byKey=k=>data.cards.find(c=>key(c)===k&&!c.archived)||data.cards.find(c=>key(c)===k);
const repoTop=c=>c.path?c.path.split('/openspec/changes/')[0]:null;
/* 派工指示（inbox.md ## 派工指示）：tests/dispatch-note-web.test.sh 從 const esc= 切到 end 標記執行 */
function dispatchBody(c,p){
  const b={slug:c.slug,agent:p.agent,model:p.model,mode:p.mode,kind:p.kind,repo:repoTop(c)};
  const note=(p.note||'').trim();if(note)b.note=note;
  return b;
}
const noteBody=(c,text)=>({slug:c.slug,text,repo:repoTop(c)});
/* 有 gate 時不給追加：細節頁的單行輸入只留給回 gate，免得指示被送成答案 */
function notesSection(c){
  const list=c.notes||[];const add=!(c.open_gates||[]).length&&c.section!=='已完成';
  if(!list.length&&!add)return '';
  const rows=list.map(n=>`<div class="note-row${n.sending?' sending':''}"><span class="mono faint">${esc(String(n.at).replace('T',' ').slice(0,16))}</span> ${esc(n.text)}${n.sending?' <span class="badge line">送出中</span>':''}</div>`).join('');
  return `<section><h3>派工指示 <span class="src">inbox.md</span></h3>${rows}${add?`<input type="text" id="note-add" aria-label="追加派工指示" placeholder="追加一條指示，Enter 送出">`:''}</section>`;
}
/* 派工指示 end */
/* 併入項目（inbox.md ## 併入： 段，opsx split-out 拆得回來的）：tests/board-merged-web.test.sh 從 start 切到 end 執行 */
/* 併入項目 start */
function mergedSection(c){
  const list=c.merged||[];
  if(!list.length)return '';
  const rows=list.map(m=>`<div class="note-row"><span class="mono faint">${esc(String(m.when).replace('T',' ').slice(0,16))} · ${esc(m.source)}</span> ${esc(m.text)} <button class="sm ghost" data-act="split-out" data-id="${esc(m.id)}">拆出來</button></div>`).join('');
  return `<section><h3>併入項目 <span class="src">inbox.md</span></h3>${rows}</section>`;
}
function splitOut(c,id){
  act(`opsx split-out ${c.slug} ${id}`,()=>api.post('split-out',{slug:c.slug,id,repo:repoTop(c)}));
}
/* 併入項目 end */
/* 邏輯表（卡目錄的 logic-map.md）：tests/logic-map-web.test.sh 從 start 切到 end 執行 */
/* 邏輯表 start */
function logicMapSection(c){
  if(!c.logic_map)return '';
  return `<section><h3>邏輯表 <span class="src">logic-map.md</span></h3><pre class="term logic-map" data-key="${esc(c.repo+'/'+c.slug)}">${esc(c.logic_map)}</pre></section>`;
}
/* 細節頁每次重畫都換掉整段 DOM；同一張卡要留在原本捲到的欄位，條件表的 file:line 在右邊 */
function logicMapScroll(view){
  const p=view.querySelector('pre.logic-map');
  return p?{key:p.dataset.key,left:p.scrollLeft}:null;
}
function restoreLogicMapScroll(view,pos){
  const p=view.querySelector('pre.logic-map');
  if(p&&pos&&p.dataset.key===pos.key)p.scrollLeft=pos.left;
}
/* 邏輯表 end */
function ago(iso){
  if(!iso)return '';const t=Date.parse(iso);if(isNaN(t))return iso;
  const s=Math.max(0,(Date.now()-t)/1000);
  if(s<60)return '剛剛';if(s<3600)return Math.floor(s/60)+' 分鐘';if(s<86400)return Math.floor(s/3600)+' 小時';return Math.floor(s/86400)+' 天';

/* 篩選 start */
const FILTER_KEYS=['repo','prio','kind','agent'];
const PRIOS=['P0','P1','P2'];
const AGENTS=['claude','codex','none'];
const TIME_PRESETS=[['today','今天'],['24h','24 小時'],['7d','7 天'],['all','全部']];
const TIME_MS={'24h':86400000,'7d':7*86400000};
const TIME_VALUES=[...TIME_PRESETS.map(x=>x[0]),'custom'];
const EV_VALUES=['all','you','agent','merge'];
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const emptyF=()=>({scope:'all',ws:null,srepo:null,repo:[],prio:[],kind:[],agent:[],you:false,pc:null,q:'',t:'all',from:'',to:'',ev:'all'});
/* known：{repos, wss（workspace 名，沒掛的是 ''）, kinds, pcs}。不認得的值直接丟掉，不畫 chip、不篩 */
function parseF(query,known){
  const p=new URLSearchParams(query||''),f=emptyF();
  const list=(k,ok)=>[...new Set((p.get(k)||'').split(',').filter(v=>ok.includes(v)))];
  f.repo=list('repo',known.repos);f.prio=list('prio',PRIOS);f.kind=list('kind',known.kinds);f.agent=list('agent',AGENTS);
  f.you=p.get('you')==='1';f.q=p.get('q')||'';
  if(known.pcs.includes(p.get('pc')))f.pc=p.get('pc');
  if(TIME_VALUES.includes(p.get('t')))f.t=p.get('t');
  if(f.t==='custom'){f.from=DATE_RE.test(p.get('from'))?p.get('from'):'';f.to=DATE_RE.test(p.get('to'))?p.get('to'):'';if(!f.from&&!f.to)f.t='all';}
  if(EV_VALUES.includes(p.get('ev')))f.ev=p.get('ev');
  const sc=p.get('sc')||'';
  if(sc.startsWith('repo:')&&known.repos.includes(sc.slice(5))){f.scope='repo';f.srepo=sc.slice(5);}
  else if(sc.startsWith('ws:')&&known.wss.includes(sc.slice(3))){f.scope='ws';f.ws=sc.slice(3)||null;}
  return f;
}
function qs(f){
  const p=new URLSearchParams();
  if(f.scope==='repo')p.set('sc','repo:'+f.srepo);else if(f.scope==='ws')p.set('sc','ws:'+(f.ws||''));
  for(const k of FILTER_KEYS)if(f[k].length)p.set(k,f[k].join(','));
  if(f.you)p.set('you','1');
  if(f.pc)p.set('pc',f.pc);
  if(f.ev!=='all')p.set('ev',f.ev);
  if(f.t!=='all')p.set('t',f.t);
  if(f.t==='custom'){if(f.from)p.set('from',f.from);if(f.to)p.set('to',f.to);}
  if(f.q)p.set('q',f.q);
  const s=p.toString();return s?'?'+s:'';
}
/* 沒有 repo 的列（同步事件）只在範圍是全部時算在範圍內 */
function scopeHas(f,scopes,repo){
  if(f.scope==='all')return true;
  if(!repo)return false;
  if(f.scope==='repo')return repo===f.srepo;
  const s=scopes.find(s=>s.repos.includes(repo));
  return (s?s.workspace:null)===f.ws;
}
const facetOf=c=>({repo:c.repo,prio:c.priority?c.priority.level:'',kind:c.kind,agent:c.dispatch&&c.dispatch.agent||'none',you:!!c.waiting,pc:c.progress_class||null,text:(c.title+' '+c.slug).toLowerCase()});
function matchF(f,x,scopes){
  if(!scopeHas(f,scopes,x.repo))return false;
  for(const k of FILTER_KEYS)if(f[k].length&&!f[k].includes(x[k]))return false;
  if(f.you&&!x.you)return false;
  if(f.pc&&x.pc!==f.pc)return false;
  return !f.q||x.text.includes(f.q.toLowerCase());
}
/* 跟瀏覽器當下時間比；今天與自訂起訖照本機的日曆日 */
function inTime(f,ts,now){
  if(f.t==='all')return true;
  const t=Date.parse(ts);if(isNaN(t))return false;
  const day=d=>new Date(d).toLocaleDateString('sv');
  if(f.t==='today')return day(t)===day(now);
  if(f.t==='custom')return (!f.from||day(t)>=f.from)&&(!f.to||day(t)<=f.to);
  return now-t<=TIME_MS[f.t];
}

  if(f.you&&g.includes('you'))items.push(['you','','只看等我的']);
  if(f.pc&&g.includes('pc'))items.push(['pc','','進度：'+(lab.pc[f.pc]||f.pc)]);
  if(f.t!=='all'&&g.includes('time'))items.push(['t','','時間：'+(f.t==='custom'?(f.from||'…')+' – '+(f.to||'…'):TIME_PRESETS.find(x=>x[0]===f.t)[1])]);

}
function chipsHtml(f,page,lab){

}
function removeChip(f,k,v){
  const o={...f};
  if(FILTER_KEYS.includes(k))o[k]=f[k].filter(x=>x!==v);

  else if(k==='pc')o.pc=null;
  else if(k==='q')o.q='';
  else if(k==='t'){o.t='all';o.from='';o.to='';}

}

      h+=`<div class="tw"><table><thead><tr>${head.map(x=>`<th>${inline(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${inline(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;continue;}
    if(/^\s*>/.test(l)){const buf=[];while(i<L.length&&/^\s*>/.test(L[i]))buf.push(L[i++].replace(/^\s*>\s?/,''));h+=`<blockquote>${md(buf.join('\n'))}</blockquote>`;continue;}
    if(RE_LI.test(l)){
      const items=[];
      while(i<L.length){
        const m=RE_LI.exec(L[i]);
        if(m){items.push({ind:m[1].replace(/\t/g,'  ').length,ord:/\d/.test(m[2]),text:m[3]});i++;continue;}
        if(L[i].trim()&&/^\s+/.test(L[i])&&items.length&&!/^\s*```/.test(L[i])){items[items.length-1].text+=' '+L[i].trim();i++;continue;}
        if(!L[i].trim()&&i+1<L.length&&RE_LI.test(L[i+1])){i++;continue;}
        break;
      }
      h+=listHtml(items);continue;}
    const buf=[];
    while(i<L.length&&L[i].trim()&&!/^(#{1,6})\s/.test(L[i])&&!/^\s*```/.test(L[i])&&!RE_LI.test(L[i])&&!/^\s*>/.test(L[i])&&!(L[i].trim().startsWith('|')&&i+1<L.length&&RE_TABLE_SEP.test(L[i+1])))buf.push(L[i++]);
    if(!buf.length){h+=`<p>${inline(L[i++])}</p>`;continue;}
    h+=`<p>${buf.map(inline).join('<br>')}</p>`;
  }
  return h;
}

const after=(ts,ls)=>!!ts&&Date.parse(ts)>=Date.parse(ls);  /* 等於也算：同一秒寫入的事件寧可重複不要漏 */
function bannerItems(events,cards,lastSeen){
  const items=[];const merged=new Set();
  for(const e of events){
    if(!after(e.ts,lastSeen))continue;
    const k=e.repo+'/'+e.slug;
    if(e.source==='sync'){if(e.new>0)items.push({text:`同步 ${e.evidence}：${e.new} 張新卡`});continue;}
    if(e.who==='你')continue;
    if(e.tag==='替你決定')items.push({key:k,text:`${e.slug}：${e.who} 替你決定「${e.text}」`});
    else if(e.tag==='已合併'){merged.add(k);items.push({key:k,text:`${e.slug} 已合併`});}
    else if(e.tag==='已指派'&&e.who==='系統')items.push({key:k,text:`${e.slug} 自動派出：${e.text}`});
  }
  for(const c of cards){
    const k=c.repo+'/'+c.slug;
    for(const g of c.open_gates||[])if(after(g.opened_at,lastSeen))items.push({key:k,text:`${c.slug} 開了 gate ${g.id}`});
    if(c.mr&&after(c.mr.created_at,lastSeen))items.push({key:k,text:`${c.slug} 開了 MR`});
    if(c.mr&&after(c.mr.merged_at,lastSeen)&&!merged.has(k)){merged.add(k);items.push({key:k,text:`${c.slug} 已合併`});}
  }
  for(const c of cards){
    if(c.section==='已完成')continue;  /* archive 不清 dispatch.json，已完成的卡 agent 不在是正常的 */
    const k=c.repo+'/'+c.slug;

  const lines=text.split(/\r\n|\r|\n/).filter(l=>l.trim());
  if(!lines.length&&!files.length)return null;
  const where=repo?{repo}:{};
  if(lines.length===1&&!files.length&&lines[0].trim().length<=ONE_LINER_MAX)return {path:'new',body:{text:lines[0].trim(),...where}};
  return {path:'paste',body:{text:text.trim(),files:files.map(f=>({name:f.name,data:f.data})),...where}};
}
function splitBySize(files){return [files.filter(f=>f.size<=MAX_ATTACH),files.filter(f=>f.size>MAX_ATTACH)];}
let newFiles=[];  /* {name, size, data(base64)}，加進清單時就讀好 */
/* newGen 在 closeNew 時加一，關掉之後才讀完的檔對不上就丟掉；newReading 是還在讀的批數，讀完前不准送出 */
let newGen=0,newReading=0;
function openNew(){$('#newbar').hidden=false;$('#new-where').textContent=newRepo()?'建在 '+F.srepo:'進待分類（範圍選到單一 repo 才直接建殼）';$('#new-text').focus();}
function closeNew(){$('#newbar').hidden=true;$('#new-text').value='';newFiles=[];newGen++;renderNewFiles();}
function renderNewFiles(){$('#new-files').innerHTML=newFiles.map((f,i)=>`<li><span class="mono">${esc(f.name)}</span><button class="ghost sm" data-act="new-unattach" data-i="${i}" aria-label="移除 ${esc(f.name)}">×</button></li>`).join('');}
function readBase64(file){
  return new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(r.result.slice(r.result.indexOf(',')+1));r.onerror=()=>bad(r.error);r.readAsDataURL(file);});
}
async function addFiles(list){
  const [fit,big]=splitBySize([...list]);
  if(big.length)toast(big.map(f=>f.name).join('、')+' 超過單檔 10 MB 上限，沒有加進清單',true);
  const gen=newGen;newReading++;
  try{
    for(const f of fit){
      /* 空檔的 data URL 是 "data:"，沒有逗號可切 */
      try{const data=f.size?await readBase64(f):'';if(gen!==newGen)return;newFiles.push({name:f.name,size:f.size,data});}
      catch(e){toast(f.name+' 讀不到：'+e.message,true);}
    }
  }finally{newReading--;}
  renderNewFiles();
}
/* 送成功才清空，而且只清送出的那份：失敗、忙碌時全留著；送出期間新打的字與新加的檔也留著。
   送出後關掉又開了新草稿（newGen 變了）就完全不動 */
function submitNew(){
  if(newReading){toast('附件還在讀，讀完再送',true);return;}
  if(ui.busy){toast('上一個動作還在跑，輸入先留著，等一下再送',true);return;}
  const text=$('#new-text').value,sent=newFiles.slice(),gen=newGen;
  const req=newRequest(text,sent,newRepo());if(!req)return;
  const where=req.body.repo?' --repo '+req.body.repo:'';
  const label=req.path==='new'?`opsx new${where} -- ${req.body.text}`:`opsx new${where}${req.body.files.map(f=>' --attach '+f.name).join('')}（貼上）`;
  act(label,async()=>{
    const r=await api.post(req.path,req.body);
    if(gen===newGen){
      newFiles=newFiles.filter(f=>!sent.includes(f));
      if($('#new-text').value===text)$('#new-text').value='';
      if(!newFiles.length&&!$('#new-text').value)closeNew();else renderNewFiles();
    }
    return r;
  });
}

/* ---------- 重新整理：上一次回來才排下一次（collect 慢時不會疊請求）；分頁藏起來就不拉；
   內容沒變就不重畫（比對時排除 generated_at，它每次都變），展開、捲動、打到一半的回覆都留著 ---------- */
/* 刷新排程 start */
/* 動作後的強制刷新碰上進行中的一輪不能丟，否則要等下一次輪詢；記下來，那一輪回來後補跑一次。輪詢碰上就放棄 */
const REFRESH_IDLE={inflight:false,pendingForce:false};
function refreshStep(st,ev){
  if(ev==='done')return st.pendingForce?{st:{inflight:true,pendingForce:false},fetch:true,force:true}:{st:REFRESH_IDLE,fetch:false,force:false};
  if(st.inflight)return {st:{inflight:true,pendingForce:st.pendingForce||ev==='force'},fetch:false,force:false};
  return {st:{inflight:true,pendingForce:false},fetch:true,force:ev==='force'};
}
/* 刷新排程 end */
/* 動作接線 start */
/* 只有 POST 本身失敗才還原與報失敗；POST 成功後重畫或刷新出錯不回滾，那時動作已經寫進檔了 */
async function runAct(env,label,fn,p){
  const {live,ui}=env;if(ui.busy){env.toast('上一個動作還在跑，等一下再按',true);return;}ui.busy=true;
  const id=++live.seq;
  try{
    let r;
    try{if(p){live.pending=[...live.pending,{...p,id,state:'sending'}];env.render();}r=await fn();}
    catch(e){if(p)live.pending=pendDrop(live.pending,id);env.toast(label+' 失敗：'+e.message,true);if(p)env.render();return;}
    if(p){live.pending=pendDone(live.pending,id,++live.seq);env.render();}
    env.toast(label+(r&&r.stdout?'\n'+r.stdout.trim():''));
    await env.refresh(true);
  }finally{ui.busy=false;}
}
/* 排隊的呼叫直接回；跑迴圈的那次收尾時一律回到閒置並排下一輪，中途例外也一樣，不然看板停止刷新 */
async function runRefresh(env,force){
  const {live}=env;let s=refreshStep(live.rs,force?'force':'poll');live.rs=s.st;
  if(!s.fetch)return;
  try{
    while(s.fetch){
      try{
        const sentAt=++live.seq;const j=await env.collect();
        const left=pendClear(live.pending,sentAt),cleared=left!==live.pending;live.pending=left;
        env.show(j,s.force||cleared);
      }catch(e){env.fail(e);}
      s=refreshStep(live.rs,'done');live.rs=s.st;
    }
  }finally{live.rs=REFRESH_IDLE;env.schedule();}
}
/* 動作接線 end */
live.rs=REFRESH_IDLE;let timer=null;
function showCollect(j,force){
  const {generated_at,...rest}=j;const raw=JSON.stringify(rest);
  if(force||raw!==lastRaw){lastRaw=raw;data=j;render();}
  else{data.generated_at=generated_at;$('#stamp').textContent='更新於 '+stampText();}
  applyDeepLink({ui,go,toast,loadedAt:pageLoadedAt},j.cards,j.generated_at);
}
function showCollectError(e){data.errors=[{source:'board',message:e.message}];render();}
function refresh(force){return runRefresh({live,collect:()=>api.collect(),show:showCollect,fail:showCollectError,schedule},force);}

if(!splitHash(location.hash).path)history.replaceState(null,'','#board'+(splitHash(location.hash).query?'?'+splitHash(location.hash).query:''));
render();loadLog();refresh(true);
</script>
