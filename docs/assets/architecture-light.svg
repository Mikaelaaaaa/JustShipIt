<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="JustShipIt 架構：一張卡從收件經 explore 到 babysit，由人合併後歸檔；opsx lead、drive、coordinate 在背景推進，看板讀卡的狀態，PR 開在 GitHub 或 GitLab，人只回 gate 與按合併">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #0F172A; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
    .title { font-weight: 700; font-size: 14px; }
    .muted { fill: #475569; font-size: 12px; }
    .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; }
    .role { fill: #EFF6FF; stroke: #93C5FD; stroke-width: 1.2; }
    .stage { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.4; }
    .human { fill: #FFFBEB; stroke: #D97706; stroke-width: 1.4; }
    .pane { fill: none; stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .line { fill: none; stroke: #64748B; stroke-width: 1.4; }
    .dash { fill: none; stroke: #2563EB; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .hline { fill: none; stroke: #D97706; stroke-width: 1.6; }
    .head { fill: #64748B; }
    .headb { fill: #2563EB; }
    .heada { fill: #D97706; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headb"/></marker>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heada"/></marker>
  </defs>

  <rect x="26" y="20" width="270" height="62" rx="10" class="role"/>
  <text x="42" y="44" class="mono">opsx lead</text>
  <text x="42" y="66" class="muted">協調者 session：把 gate 轉給你、排合併順序</text>

  <rect x="345" y="20" width="270" height="62" rx="10" class="role"/>
  <text x="361" y="44" class="mono">opsx drive</text>
  <text x="361" y="66" class="muted">每張卡一個，從 explore 推到 babysit</text>

  <rect x="664" y="20" width="270" height="62" rx="10" class="role"/>
  <text x="680" y="44" class="mono">opsx coordinate</text>
  <text x="680" y="66" class="muted">每 5 分鐘：派工、重派、收尾</text>

  <path d="M66 82V172" class="dash" marker-end="url(#b)"/>
  <text x="74" y="128" class="muted">派去 explore</text>
  <path d="M480 82V142" class="dash" marker-end="url(#b)"/>
  <text x="488" y="118" class="muted">每輪送下一站</text>
  <path d="M760 82V142" class="dash" marker-end="url(#b)"/>
  <text x="768" y="118" class="muted">派工、重派、收尾</text>

  <rect x="110" y="144" width="648" height="104" rx="12" class="pane"/>
  <text x="122" y="162" class="muted">agent pane，各自在 worktree 裡做</text>

  <rect x="26" y="174" width="80" height="40" rx="8" class="box"/>
  <text x="66" y="199" text-anchor="middle">收件</text>
  <rect x="118" y="174" width="80" height="40" rx="8" class="stage"/>
  <text x="158" y="199" text-anchor="middle">explore</text>
  <rect x="210" y="174" width="80" height="40" rx="8" class="stage"/>
  <text x="250" y="199" text-anchor="middle">grill</text>
  <rect x="302" y="174" width="80" height="40" rx="8" class="stage"/>
  <text x="342" y="199" text-anchor="middle">propose</text>
  <rect x="394" y="174" width="80" height="40" rx="8" class="stage"/>
  <text x="434" y="199" text-anchor="middle">apply</text>
  <rect x="486" y="174" width="80" height="40" rx="8" class="stage"/>
  <text x="526" y="199" text-anchor="middle">review</text>
  <rect x="578" y="174" width="80" height="40" rx="8" class="stage"/>
  <text x="618" y="199" text-anchor="middle">pr</text>
  <rect x="670" y="174" width="80" height="40" rx="8" class="stage"/>
  <text x="710" y="199" text-anchor="middle">babysit</text>
  <rect x="770" y="174" width="80" height="40" rx="8" class="human"/>
  <text x="810" y="199" text-anchor="middle">合併：人</text>
  <rect x="862" y="174" width="72" height="40" rx="8" class="box"/>
  <text x="898" y="199" text-anchor="middle">archive</text>

  <path d="M106 194H117" class="line" marker-end="url(#a)"/>
  <path d="M198 194H209" class="line" marker-end="url(#a)"/>
  <path d="M290 194H301" class="line" marker-end="url(#a)"/>
  <path d="M382 194H393" class="line" marker-end="url(#a)"/>
  <path d="M474 194H485" class="line" marker-end="url(#a)"/>
  <path d="M566 194H577" class="line" marker-end="url(#a)"/>
  <path d="M658 194H669" class="line" marker-end="url(#a)"/>
  <path d="M750 194H769" class="line" marker-end="url(#a)"/>
  <path d="M850 194H861" class="line" marker-end="url(#a)"/>

  <path d="M250 248V318" class="line" marker-end="url(#a)"/>
  <text x="258" y="280" class="muted">寫 gate 與狀態</text>
  <path d="M618 214V318" class="line" marker-end="url(#a)"/>
  <text x="626" y="280" class="muted">開 PR</text>
  <path d="M710 214V318" class="line" marker-end="url(#a)"/>
  <text x="716" y="280" class="muted">CI、review</text>

  <rect x="26" y="320" width="420" height="76" rx="10" class="box"/>
  <text x="42" y="346" class="title">看板</text>
  <text x="42" y="368" class="muted">網頁看板與 herdr 右側 pane，資料全由 opsx collect 算出</text>
  <text x="42" y="386" class="muted">等你處理的卡、各階段分布、agent 與 MR</text>

  <rect x="560" y="320" width="200" height="76" rx="10" class="box"/>
  <text x="576" y="346" class="title">forge</text>
  <text x="576" y="368" class="muted">GitHub（gh）或 GitLab（glab）</text>
  <text x="576" y="386" class="muted">PR、CI、review</text>

  <rect x="770" y="320" width="164" height="76" rx="10" class="human"/>
  <text x="786" y="346" class="title">你</text>
  <text x="786" y="368" class="muted">回 gate</text>
  <text x="786" y="386" class="muted">按合併（只有你能）</text>

  <path d="M810 320V215" class="hline" marker-end="url(#h)"/>
  <text x="818" y="270" class="muted">按合併</text>
  <path d="M852 396V440H236V397" class="hline" marker-end="url(#h)"/>
  <text x="544" y="460" class="muted" text-anchor="middle">在看板回 gate，或跑 opsx answer</text>
</svg>
